<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Async Weather Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(to top, #87ceeb, #e6f7ff);
    overflow-x: hidden;
    position: relative;
}

body::before,
body::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 60px;
    background: #ffffffcc;
    border-radius: 50px;
    filter: blur(2px);
    opacity: 0.85;
}

body::before {
    top: 60px;
    left: -400px;
    animation: moveClouds 40s linear infinite;
    box-shadow: 30px 0px 0px #fff, 70px 5px 0px #fff, 20px -8px 0px #fff;
}

body::after {
    top: 140px;
    left: -300px;
    animation: moveClouds 55s linear infinite;
    box-shadow: 50px 0px 0px #fff, 100px 15px 0px #fff, 30px -12px 0px #fff;
}

@keyframes moveClouds {
    from { transform: translateX(0); }
    to { transform: translateX(140vw); }
}

.container {
    text-align: center;
    padding: 30px;
}

h1 {
    color: #ffcc00;
    margin-bottom: 30px;
}

.parent-card {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: rgba(255,255,255,0.9);
    border-radius: 16px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

.input-group {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #ffcc00;
    cursor: pointer;
}

.weather-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
}

.history span {
    display: inline-block;
    background: #e6f7ff;
    padding: 6px 12px;
    margin: 5px;
    border-radius: 20px;
    cursor: pointer;
}

.history span:hover {
    background: #87ceeb;
    color: white;
}
</style>
</head>

<body>

<div class="container">
    <h1>🌤 Async Weather Tracker</h1>

    <div class="parent-card">
        <div class="card">
            <h3>Search City</h3>
            <div class="input-group">
                <input id="cityInput" placeholder="Meerut, India">
                <button id="searchBtn">Search</button>
            </div>

            <h3 style="margin-top:20px;">Search History</h3>
            <div class="history" id="history"></div>
        </div>

        <div class="card">
            <h3>Weather Info</h3>
            <div id="weather"></div>
        </div>
    </div>
</div>

<script>
const API_KEY = "acd417addd6ccfc98ad9915194a";

const weatherBox = document.getElementById("weather");
const historyBox = document.getElementById("history");
const cityInput = document.getElementById("cityInput");

/* ---------- FETCH WEATHER ---------- */
async function getWeather(city) {
    const res = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
    );

    if (!res.ok) throw new Error("City not found");

    return await res.json();
}

/* ---------- RENDER WEATHER ---------- */
function renderWeather(d) {
    weatherBox.innerHTML = `
        <div class="weather-item"><label>City</label><span>${d.name}, ${d.sys.country}</span></div>
        <div class="weather-item"><label>Temperature</label><span>${d.main.temp} °C</span></div>
        <div class="weather-item"><label>Weather</label><span>${d.weather[0].main}</span></div>
        <div class="weather-item"><label>Humidity</label><span>${d.main.humidity}%</span></div>
        <div class="weather-item"><label>Wind</label><span>${d.wind.speed} m/s</span></div>
    `;
}

/* ---------- SAVE HISTORY ---------- */
function saveHistory(city) {
    let history = JSON.parse(localStorage.getItem("weatherHistory") || "[]");

    // remove duplicate
    history = history.filter(c => c.toLowerCase() !== city.toLowerCase());

    history.unshift(city);

    // limit to 5 items
    history = history.slice(0, 5);

    localStorage.setItem("weatherHistory", JSON.stringify(history));

    showHistory();
}

/* ---------- SHOW HISTORY ---------- */
function showHistory() {
    let history = JSON.parse(localStorage.getItem("weatherHistory") || "[]");

    historyBox.innerHTML = "";

    history.forEach(city => {
        let tag = document.createElement("span");
        tag.textContent = city;
        tag.onclick = () => search(city);
        historyBox.appendChild(tag);
    });
}

/* ---------- SEARCH ---------- */
async function search(city) {
    weatherBox.innerHTML = "Loading...";
    try {
        const data = await getWeather(city);
        renderWeather(data);
        saveHistory(data.name);
    } catch (err) {
        weatherBox.innerHTML = `<p style="color:red">${err.message}</p>`;
    }
}

/* ---------- EVENTS ---------- */
document.getElementById("searchBtn").onclick = () => {
    const city = cityInput.value.trim();
    if (city) search(city);
};

cityInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        const city = cityInput.value.trim();
        if (city) search(city);
    }
});

/* ---------- INIT ---------- */
showHistory();
</script>

</body>
</html>
